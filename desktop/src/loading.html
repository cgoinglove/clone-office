<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src data:"
    />
    <title>Clone Office</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #0d0d0d;
        --muted: #6b6b6b;
        --paper: #ffffff;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          15px/1.4 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
      }
      main {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        -webkit-app-region: drag;
      }
      svg.mark {
        width: 56px;
        height: 58px;
      }
      p {
        margin: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
      }
      .spin {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid currentColor;
        border-right-color: transparent;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <!-- The app's mark (app/icon.svg), put in by desktop/build.mjs. -->
      {{mark}}
      <p role="status"><span class="spin" aria-hidden="true"></span>{{starting}}</p>
    </main>
  </body>
</html>
