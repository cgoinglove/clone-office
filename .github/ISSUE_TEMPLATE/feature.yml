name: Idea
description: Something your clone, or your team's, should do
labels: [idea]
body:
  - type: textarea
    id: moment
    attributes:
      label: The moment
      description: When you wished it did this. A real day's moment says more than a feature name.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What you do today instead
      description: Who you ask, what you copy, where you paste.

  - type: textarea
    id: share
    attributes:
      label: Whose call it stays
      description: >
        A clone brings people only what is theirs to decide. Which part of this would still be yours
        (or a colleague's), if any?
