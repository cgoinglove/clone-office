name: Desktop

# The desktop app (desktop/): Clone Office in one downloaded file for each system, with no Node.js to
# install. Built when a release is published, and its files attached to that release, where
# electron-updater finds them (latest*.yml). Release Please publishes releases with the workflow's
# own token, which starts no other workflow, so the release workflow calls this one once the
# package is on npm (release.yml); a release a person publishes starts it by itself. By hand
# (Actions › Desktop › Run workflow): a release's tag builds and attaches to that release; no tag
# builds the branch and keeps the files with the run only.
#
# Unsigned until the signing secrets below are set (desktop/electron-builder.config.cjs says what
# each is): macOS ad hoc, which people open the first time with right-click › Open; Windows
# unsigned, through SmartScreen's More info › Run anyway. Actions are pinned to the commit their
# release tag names.
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: The release's tag (v0.2.0) to build and attach the files to.
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "A release's tag (v0.2.0) to build and attach to. Empty: build this branch, keeping the files with the run only."
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: desktop-${{ inputs.tag || github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  # The server inside the app is the same for every system (desktop/build.mjs): the npm package,
  # unpacked, with its dependencies. Made once, with the same checks the package gets.
  server:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.what.outputs.tag }}
    steps:
      - name: Decide what to build
        id: what
        run: echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name || '' }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.what.outputs.tag || github.ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm
      # pack.mjs bundles with the repository's own esbuild.
      - run: pnpm install --frozen-lockfile
      - run: node desktop/build.mjs --server-only
      # As a tarball, which keeps the files' modes (the sandbox's helpers are programs).
      - run: tar -czf server.tgz -C desktop/stage/server .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-server
          path: server.tgz
          if-no-files-found: error
          retention-days: 3

  # Each system's files, made on that system: a .dmg and a .zip for Apple silicon and Intel Macs,
  # a Windows installer, a Linux AppImage and .deb.
  app:
    needs: server
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            system: --mac
          - os: windows-latest
            system: --win
          - os: ubuntu-latest
            system: --linux
    runs-on: ${{ matrix.os }}
    permissions:
      # Attaching the files to the release.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.server.outputs.tag || github.ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-server
          path: .
      # The desktop's own tools (Electron, electron-builder), apart from the repository's.
      - run: pnpm --dir desktop install --ignore-workspace --frozen-lockfile
      - run: node desktop/build.mjs ${{ matrix.system }} --server server.tgz
        env:
          # Signing, once these secrets are set; empty ones are left out, and the build is unsigned.
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ runner.os }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.blockmap
            desktop/release/latest*.yml
          if-no-files-found: error
          retention-days: 7
      # A branch's own workflow file must not attach anything to a release.
      - name: Attach to the release
        if: needs.server.outputs.tag != '' && (github.event_name == 'release' || github.ref == 'refs/heads/main')
        shell: bash
        run: |
          shopt -s nullglob
          files=(desktop/release/*.{dmg,zip,exe,AppImage,deb,blockmap} desktop/release/latest*.yml)
          gh release upload "$TAG" "${files[@]}" --clobber
        env:
          TAG: ${{ needs.server.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
