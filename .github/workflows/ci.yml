name: CI

# After Thursday's CI, with Hermes Agent's question added at the end: can a person on each system
# actually install this and open it? Actions are pinned to the commit their release tag names.
on:
  push:
    branches: [main]
  pull_request:
  # The release runs this same check before it publishes (release.yml).
  workflow_call:

# A newer push to the same branch makes the older run pointless. Keyed by the workflow too:
# called from the release, `github.workflow` is the release's, so the two runs a push to main
# starts never cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The newest Node `engines` takes, and the oldest it promises for working on the code.
        node: [from-engines, "22.18"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ matrix.node == 'from-engines' && 'package.json' || '' }}
          node-version: ${{ matrix.node != 'from-engines' && matrix.node || '' }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Files, exports and dependencies nothing uses any more (after Thursday's CI). It reports and
      # never fails the run: the old office drawing waits for the design system's next export.
      - run: pnpm knip
        continue-on-error: true
      # Every AI service, relay and Claude Code is stood in for; none of these reaches the network.
      - run: pnpm test
      # The only check that catches a client component importing something server-only.
      - run: pnpm build

  # The package exactly as npm would get it (scripts/pack.mjs), built once for every system below.
  package:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: node scripts/pack.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: dist/clone-office-*.tgz
          if-no-files-found: error
          retention-days: 7

  # What a person does: `npx clone-office` from the package, then open it. On each system,
  # Windows included, with the Node a person gets from nodejs.org today (scripts/smoke.mjs).
  install:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: dist
      - run: node scripts/smoke.mjs

  # What a Node the app does not take is told. Ubuntu 22.04 and Debian 11 install Node 12, and
  # an ES module dies on what an older Node lacks before any check in it runs; the CommonJS
  # entry (bin/clone-office.cjs) says what to do instead. Nothing is installed.
  old-node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["10", "12", "16", "18", "20", "22.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Refused, with what to do
        run: |
          set +e
          out="$(node bin/clone-office.cjs 2>&1)"
          code=$?
          echo "$out"
          [ "$code" = 1 ] && echo "$out" | grep -q "needs Node.js 22.13"
